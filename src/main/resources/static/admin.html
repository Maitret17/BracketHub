<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BracketHub - Admin</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<nav>
    <img src="brackethublogo.png" alt="BracketHub" style="height: 40px; width: auto;">

    <div>
        <span id="username"></span>
        <a href="/index.html">Home</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<div class="container">

    <h1>Tournament Management</h1>

    <p id="message"></p>

    <h2 id="formTitle">Create Tournament</h2>

    <form id="tournamentForm">

        <input
                type="text"
                id="name"
                placeholder="Tournament name"
                required
        >

        <label>
            Start date:
            <input
                    type="date"
                    id="startDate"
                    required
            >
        </label>

        <label>
            End date:
            <input
                    type="date"
                    id="endDate"
                    required
            >
        </label>

        <input
                type="number"
                id="maxPlayers"
                placeholder="Maximum players"
                min="1"
                required
        >

        <label>
            Status:
            <select id="status" required></select>
        </label>

        <label>
            Discipline:
            <select id="discipline" required></select>
        </label>

        <div>
            <button type="submit" class="create-btn" id="submitButton">
                Create Tournament
            </button>

            <button
                    type="button"
                    class="cancel-btn"
                    id="cancelButton"
                    onclick="cancelEdit()"
                    style="display:none;"
            >
                Cancel
            </button>
        </div>

    </form>

    <h2>Existing Tournaments</h2>

    <div id="tournaments"></div>

</div>
<script src="js/admin.js"></script>

</body>
</html>
