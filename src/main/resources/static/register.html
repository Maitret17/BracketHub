<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BracketHub - Register</title>
    <link rel="stylesheet" href="css/register.css">

</head>

<body>

<div class="register-box">

    <img src="brackethublogo.png" style="display: block; height: 40px; width: auto; margin: 0 auto 20px;">

    <form id="registerForm">

        <input
                type="text"
                id="firstName"
                placeholder="First name"
                required
        >

        <input
                type="text"
                id="lastName"
                placeholder="Last name"
                required
        >

        <input
                type="number"
                id="age"
                placeholder="Age"
                min="0"
                required
        >

        <input
                type="text"
                id="username"
                placeholder="Username"
                required
        >

        <input
                type="password"
                id="password"
                placeholder="Password"
                required
        >

        <button type="submit">
            Create account
        </button>

    </form>

    <p id="message"></p>

    <div class="login-link">
        Already have an account?
        <a href="/login.html">Login</a>
    </div>

</div>


<script src="js/register.js"></script>

</body>
</html>
