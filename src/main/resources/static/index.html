<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BracketHub</title>

    <link rel="stylesheet" href="css/index.css">
</head>

<body>

<nav>

    <img src="brackethublogo.png" alt="BracketHub" style="height: 40px; width: auto;">

    <div>
        <span id="username"></span>

        <a href="/login.html" id="loginLink">
            Login
        </a>

        <a href="#" id="logoutLink" style="display:none;" onclick="logout()">
            Logout
        </a>
    </div>

</nav>


<div class="container">



    <div id="adminPanel">

        <h2>Administration</h2>

        <p>
            You are logged in as an administrator.
        </p>

        <a
                href="/admin.html"
                class="admin-btn">
            Manage Tournaments
        </a>

    </div>


    <h2>Tournaments</h2>

    <div id="tournaments">

        <div class="message">
            Loading tournaments...
        </div>

    </div>

</div>


<script>

    const playerId = sessionStorage.getItem("playerId");
    const username = sessionStorage.getItem("username");
    const role = sessionStorage.getItem("role");


    /*
     * Display login information
     */

    if (username) {

        document.getElementById("username").textContent =
            username;

        document.getElementById("loginLink").style.display =
            "none";

        document.getElementById("logoutLink").style.display =
            "inline";

        document.getElementById("welcomeMessage").textContent =
            `Welcome ${username}! You can join available tournaments.`;

    }


    /*
     * Show admin panel only to admins
     */

    if (role === "ADMIN") {

        document.getElementById("adminPanel").style.display =
            "block";

    }


    /*
     * Load tournaments
     */

    async function loadTournaments() {

        try {

            const response =
                await fetch("/tournaments");

            if (!response.ok) {

                throw new Error(
                    "Unable to load tournaments."
                );

            }

            const tournaments =
                await response.json();

            const container =
                document.getElementById("tournaments");

            container.innerHTML = "";


            if (tournaments.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        No tournaments available.
                    </div>
                `;

                return;
            }


            tournaments.forEach(tournament => {

                const players =
                    tournament.players || [];


                /*
                 * Check whether the current player
                 * has already joined this tournament.
                 */

                const isJoined =
                    players.some(player =>
                        String(player.id) === String(playerId)
                    );


                /*
                 * Check whether tournament is full.
                 */

                const isFull =
                    players.length >= tournament.maxPlayers;


                let button = "";


                /*
                 * Player is not logged in
                 */

                if (!playerId) {

                    button = `
                        <button
                            class="join-btn"
                            onclick="goToLogin()">
                            Login to Join
                        </button>
                    `;

                }

                /*
                 * Player already joined
                 */

                else if (isJoined) {

                    button = `
                        <button
                            class="leave-btn"
                            onclick="leaveTournament(${tournament.id})">
                            Leave Tournament
                        </button>
                    `;

                }

                /*
                 * Tournament is full
                 */

                else if (isFull) {

                    button = `
                        <button disabled>
                            Tournament Full
                        </button>
                    `;

                }

                /*
                 * Tournament is finished
                 */

                else if (tournament.status === "FINISHED") {

                    button = `
                        <button disabled>
                            Tournament Finished
                        </button>
                    `;

                }

                /*
                 * Player can join
                 */

                else {

                    button = `
                        <button
                            class="join-btn"
                            onclick="joinTournament(${tournament.id})">
                            Join Tournament
                        </button>
                    `;
                }


                /*
                 * Create tournament card
                 */

                const tournamentElement =
                    document.createElement("div");

                tournamentElement.className =
                    "tournament";


                tournamentElement.innerHTML = `

                    <h3>
                        ${escapeHtml(tournament.name)}
                    </h3>

                    <p>
                        <strong>Dates:</strong>
                        ${tournament.startDate}
                        →
                        ${tournament.endDate}
                    </p>

                    <p>
                        <strong>Players:</strong>
                        ${players.length}
                        /
                        ${tournament.maxPlayers}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status">
                            ${tournament.status}
                        </span>
                    </p>

                    <p>
                        <strong>Discipline:</strong>
                        ${tournament.discipline}
                    </p>

                    <div class="actions">
                        ${button}
                    </div>

                `;


                container.appendChild(
                    tournamentElement
                );

            });

        } catch (error) {

            console.error(error);

            document.getElementById("tournaments").innerHTML = `
                <div class="message">
                    Unable to load tournaments.
                </div>
            `;

        }

    }


    /*
     * Join tournament
     */

    async function joinTournament(tournamentId) {

        if (!playerId) {

            goToLogin();

            return;
        }


        try {

            const response =
                await fetch(
                    `/tournaments/${tournamentId}/players/${playerId}`,
                    {
                        method: "PUT"
                    }
                );


            if (!response.ok) {

                const message =
                    await response.text();

                alert(
                    message ||
                    "Unable to join the tournament."
                );

                return;
            }


            alert(
                "You joined the tournament!"
            );


            loadTournaments();

        } catch (error) {

            console.error(error);

            alert(
                "An error occurred while joining the tournament."
            );

        }

    }


    /*
     * Leave tournament
     */

    async function leaveTournament(tournamentId) {

        if (!playerId) {
            return;
        }


        const confirmed =
            confirm(
                "Are you sure you want to leave this tournament?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/tournaments/${tournamentId}/players/${playerId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const message =
                    await response.text();

                alert(
                    message ||
                    "Unable to leave the tournament."
                );

                return;
            }


            alert(
                "You left the tournament!"
            );


            loadTournaments();

        } catch (error) {

            console.error(error);

            alert(
                "An error occurred while leaving the tournament."
            );

        }

    }


    /*
     * Redirect to login
     */

    function goToLogin() {

        window.location.href =
            "/login.html";

    }


    /*
     * Logout
     */

    function logout() {

        sessionStorage.clear();

        window.location.href =
            "/login.html";

    }


    /*
     * Prevent HTML injection from tournament names
     */

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value;

        return div.innerHTML;

    }


    /*
     * Load tournaments when page opens
     */

    loadTournaments();

</script>

</body>

</html>
