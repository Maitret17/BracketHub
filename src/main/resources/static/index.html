<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BracketHub</title>

    <link rel="stylesheet" href="css/index.css">
</head>

<body>

<nav>

    <img src="brackethublogo.png" alt="BracketHub" style="height: 40px; width: auto;">

    <div>
        <span id="username"></span>

        <a href="/login.html" id="loginLink">
            Login
        </a>

        <a href="#" id="logoutLink" style="display:none;" onclick="logout()">
            Logout
        </a>
    </div>

</nav>


<div class="container">



    <div id="adminPanel">

        <h2>Administration</h2>

        <p>
            You are logged in as an administrator.
        </p>

        <a
                href="/admin.html"
                class="admin-btn">
            Manage Tournaments
        </a>

    </div>


    <h2>Tournaments</h2>

    <div id="tournaments">

        <div class="message">
            Loading tournaments...
        </div>

    </div>

</div>


<script src="js/index.js"></script>

</body>

</html>
